# CI — lint, unit tests, production build, end-to-end smoke, and Docker image build.
# Runs on every PR and on pushes to the long-lived branches. Mark the jobs below
# as required status checks in branch protection to actually block bad merges.
#
# Repo layout note: the client (Vite PWA) lives in client/ and the server (AWS SAM
# backend) lives in server/. These jobs build/test the CLIENT only — the server is
# deployed separately with `sam deploy` (see server/README.md). The client uses pnpm
# (pnpm-lock.yaml is the source of truth), so every job installs with pnpm.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# All run-steps default to the client/ directory (where package.json lives).
defaults:
  run:
    working-directory: client

jobs:
  lint-test-build:
    name: Lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # route data lives in the client/src/data/routes submodule
      - uses: pnpm/action-setup@v4 # reads the pinned version from package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # playwright.config.js webServer runs `pnpm run build && pnpm run preview`,
      # so the production build is exercised here too.
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    # The Docker build runs from the repo root with the client/ context, so this
    # job does not use the client/ working-directory default.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: false
          load: true
          tags: sakaydavao:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
