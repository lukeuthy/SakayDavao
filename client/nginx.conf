server {
  listen       80;
  server_name  _;
  root   /usr/share/nginx/html;
  index  index.html;

  # gzip text assets (wasm included; it's large but rarely fetched).
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/css application/javascript application/json
                    image/svg+xml application/manifest+json;

  # ── Security headers (server scope = inherited by `location /`, which serves
  #    the SPA for every app route). NOTE: nginx resets inherited add_header in
  #    any location that declares its own, so the set is repeated where needed.
  #    Content-Security-Policy notes (why each source is allowed):
  #      script-src  'wasm-unsafe-eval' → ONNX Runtime Web compiles wasm
  #      style-src   'unsafe-inline'    → inline splash <style> + Google Fonts CSS
  #      font-src    fonts.gstatic.com  → Google Fonts
  #      img-src     openstreetmap + data:/blob: → Leaflet map tiles & markers
  #      connect-src https:             → contributions API + optional feeds.
  #                  TIGHTEN to your exact API/feed origins before/after deploy,
  #                  e.g. connect-src 'self' https://abc123.execute-api.ap-southeast-1.amazonaws.com;
  #      frame-ancestors 'none'         → clickjacking protection
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  # SakayDavao uses HashRouter — every client route lives under /#/..., so the
  # server only ever needs to return index.html. try_files is a safety net.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The HTML document: never cache it (so new deploys reach users), and re-declare
  # the full security header set (a per-location add_header resets inherited ones).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  }
  location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Hashed build assets are content-addressed → cache them aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
}
