# One-command run:  docker compose up --build
# Then open http://localhost:8080
#
# This builds ONLY the client (the static PWA). The server (server/) is the AWS
# SAM backend and is deployed separately with `sam deploy` — it is not part of
# this image. Build context is ./client so the Dockerfile there sees its files.
services:
  sakaydavao:
    build:
      context: ./client
      args:
        # Optional external feeds (baked at build time). Leave empty to run
        # fully offline on bundled data.
        VITE_ROUTES_URL: ${VITE_ROUTES_URL:-}
        VITE_REALTIME_URL: ${VITE_REALTIME_URL:-}
    image: sakaydavao:latest
    ports:
      - "8080:80"
    restart: unless-stopped
