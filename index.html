<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SakayDavao — Live tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: oklch(0.97 0.012 155);
    --surface: #ffffff;
    --cream: oklch(0.97 0.012 100);
    --ink: oklch(0.20 0.012 155);
    --ink-2: oklch(0.42 0.012 80);
    --ink-3: oklch(0.62 0.010 80);
    --line: oklch(0.93 0.008 155);
    --primary: oklch(0.42 0.10 155);
    --primary-soft: oklch(0.95 0.045 155);    /* selected-card tint */
    --primary-mid: oklch(0.62 0.13 155);      /* mid-tone for accents */
    --primary-deep: oklch(0.30 0.07 155);     /* dark pill CTA */
    --primary-on: oklch(0.98 0.008 155);
    --primary-glow: oklch(0.74 0.18 145);     /* live-dot lime */
    --accent: oklch(0.74 0.15 70);
    --accent-deep: oklch(0.58 0.16 55);
    --pink-soft: oklch(0.93 0.04 25);         /* cancel pill bg */
    --pink-ink: oklch(0.55 0.12 25);
    --map-land: oklch(0.96 0.012 90);
    --map-water: oklch(0.92 0.022 230);
    --map-road: oklch(0.99 0.003 80);
    --map-road-line: oklch(0.86 0.008 80);
    --shadow-sm: 0 1px 2px rgba(20,40,30,0.04), 0 2px 8px rgba(20,40,30,0.04);
    --shadow-md: 0 2px 6px rgba(20,40,30,0.05), 0 12px 28px rgba(20,40,30,0.08);
    --shadow-lg: 0 4px 12px rgba(20,40,30,0.06), 0 24px 48px rgba(20,40,30,0.12);
    --shadow-hero: 0 8px 24px rgba(20,50,35,0.16), 0 24px 60px rgba(20,50,35,0.12);
  }
  html, body {
    margin: 0; padding: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, oklch(0.92 0.045 155) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 90% 80%, oklch(0.93 0.038 145) 0%, transparent 55%),
      oklch(0.95 0.018 150);
    background-attachment: fixed;
    font-family: 'Geist', system-ui, sans-serif; color: var(--ink); overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
  }
  #root { width: 100vw; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; position: relative; }
  /* Elmov-style ghosted wordmark behind the device */
  .brand-ghost {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 0; font-family: 'Geist'; font-weight: 700;
    font-size: 28vh; color: oklch(0.88 0.030 155); opacity: 0.45;
    letter-spacing: -0.04em; mix-blend-mode: multiply;
    white-space: nowrap; user-select: none;
  }
  .brand-corner {
    position: fixed; top: 18px; font-family: 'Geist'; font-size: 13px;
    color: var(--ink-2); font-weight: 500; z-index: 1; pointer-events: none;
  }
  .brand-corner.tl { left: 24px; }
  .brand-corner.tr { right: 24px; }
  .brand-corner.bl { bottom: 18px; top: auto; }
  .brand-corner.br { bottom: 18px; top: auto; right: 24px; }
  /* hide scrollbar on stop lists */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  button { font-family: inherit; }
  /* keyframes */
  @keyframes pulse-ring {
    0% { transform: scale(0.6); opacity: 0.6; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @keyframes blink-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @keyframes slide-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
</style>
</head>
<body>
<div class="brand-ghost">Sakay</div>
<div class="brand-corner tl"><strong style="font-weight:600;color:var(--ink)">Sakay.</strong></div>
<div class="brand-corner tr">Davao · Live Transit</div>
<div class="brand-corner bl">Faster waits. Smarter rides.</div>
<div class="brand-corner br">Powered by historical data</div>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="map.jsx"></script>
<script type="text/babel" src="layouts.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
