server {
  listen       80;
  server_name  _;
  root   /usr/share/nginx/html;
  index  index.html;

  # gzip text assets (wasm included; it's large but rarely fetched).
  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_types        text/css application/javascript application/json
                    image/svg+xml application/wasm application/manifest+json;

  # SakayDavao uses HashRouter — every client route lives under /#/..., so the
  # server only ever needs to return index.html. try_files is a safety net.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Never cache the entry document or the service worker: this is what lets a
  # new deploy (and the in-app "new version" prompt) actually reach users.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }
  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Hashed build assets are content-addressed → cache them aggressively.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Ensure correct MIME for the ONNX runtime (older nginx mime.types lack it).
  location ~* \.wasm$ {
    default_type application/wasm;
    add_header Cache-Control "public, max-age=604800";
  }
}
